<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chyby měření - Kvíz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #1b2735, #090a0f);
        background-attachment: fixed;
        min-height: 100vh;
        color: white;
        padding-bottom: 50px;
    }

    .container {
        max-width: 800px;
        margin: auto;
        padding: 30px 15px;
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    p.subtitle {
        text-align: center;
        color: rgba(255,255,255,0.7);
        margin-bottom: 30px;
        font-size: 0.95rem;
    }

    .card {
        background: rgba(255,255,255,0.1);
        padding: 20px;
        margin: 15px 0;
        border-radius: 12px;
        transition: 0.3s;
    }

    .card-text {
        font-size: 1rem;
        margin-bottom: 15px;
        line-height: 1.4;
    }

    /* Kontejner pro tlačítka možností */
    .options {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    /* Samotná tlačítka (štítky) */
    .option-btn {
        flex: 1;
        min-width: 30%;
        background: rgba(255,255,255,0.15);
        color: white;
        border: 2px solid transparent;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        font-size: 0.9rem;
        transition: 0.2s;
        text-align: center;
    }

    .option-btn:hover {
        background: rgba(255,255,255,0.25);
    }

    /* Stav, kdy student na tlačítko klikne (vybere ho) */
    .option-btn.selected {
        background: #007bff;
        border-color: #007bff;
        font-weight: 600;
    }

    /* Stavy po kontrole (správně / špatně) */
    .option-btn.correct {
        background: #28a745 !important;
        border-color: #28a745 !important;
        color: white;
    }

    .option-btn.incorrect {
        background: #dc3545 !important;
        border-color: #dc3545 !important;
        opacity: 0.8;
    }

    /* Tlačítko pro vyhodnocení */
    .submit-btn {
        display: block;
        width: 100%;
        max-width: 300px;
        margin: 40px auto 20px;
        padding: 15px 20px;
        background: white;
        color: #1c3d5a;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        transition: 0.3s;
    }

    .submit-btn:hover {
        background: #e0e0e0;
        transform: translateY(-2px);
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: rgba(255,255,255,0.7);
        text-decoration: none;
        padding: 10px 0;
    }

    .back:hover {
        color: white;
    }

    #result-msg {
        text-align: center;
        font-size: 1.2rem;
        font-weight: 600;
        margin-top: 15px;
        min-height: 30px;
    }

    /* Aby se tlačítka na malých mobilech (např. iPhone SE) přeskládala pod sebe, pokud by byla moc úzká */
    @media (max-width: 480px) {
        .options { flex-direction: column; }
        .option-btn { width: 100%; padding: 12px; }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Rozlišování chyb měření</h1>
    <p class="subtitle">U každé situace vyber, o jaký typ chyby se jedná.</p>

    <!-- Sem se vygenerují otázky přes JavaScript -->
    <div id="quiz-container"></div>

    <button class="submit-btn" onclick="checkAnswers()">Zkontrolovat odpovědi</button>
    
    <div id="result-msg"></div>

    <a class="back" href="../index.html">← zpět na kvintu</a>
</div>

<script>
    // Seznam otázek (stejný jako minule)
    const cardsData = [
        { id: "c1", type: "nahodna", text: "Reakční doba: Při měření času stopkami pokaždé stiskneš tlačítko o malou chvilku dřív nebo později." },
        { id: "c2", type: "systematicka", text: "Nevynulované měřidlo: Ručička ampérmetru není na nule ještě předtím, než ho zapojíš do obvodu." },
        { id: "c3", type: "hruba", text: "Přepis: Na displeji bylo 12,5 s, ale do sešitu sis omylem zapsal(a) 21,5 s." },
        { id: "c4", type: "nahodna", text: "Kolísání: Při vážení na citlivé váze hodnota neustále přeskakuje mezi 5,13 g a 5,14 g." },
        { id: "c5", type: "systematicka", text: "Chyba paralaxy: Odečítáš objem v odměrném válci, ale díváš se na stupnici zešikma." },
        { id: "c6", type: "hruba", text: "Záměna veličin: Místo průměru drátu jsi do vzorce omylem dosadil(a) jeho poloměr." },
        { id: "c7", type: "systematicka", text: "Opotřebení: Kraj pravítka je ošoupaný a ty začínáš měřit od kraje místo od nuly." },
        { id: "c8", type: "hruba", text: "Záškodnictví: Při měření teploty jsi omylem chytil(a) teploměr za baňku s lihem a zahřál(a) ho rukou." }
    ];

    // Zamíchání pole, aby to nebylo pokaždé ve stejném pořadí
    cardsData.sort(() => Math.random() - 0.5);

    const container = document.getElementById('quiz-container');

    // Vykreslení karet
    cardsData.forEach(card => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        cardDiv.dataset.correctType = card.type; // Uložíme si správnou odpověď do datového atributu

        // HTML struktura jedné kartičky
        cardDiv.innerHTML = `
            <div class="card-text">${card.text}</div>
            <div class="options">
                <button class="option-btn" data-value="hruba" onclick="selectOption(this)">Hrubá</button>
                <button class="option-btn" data-value="systematicka" onclick="selectOption(this)">Systematická</button>
                <button class="option-btn" data-value="nahodna" onclick="selectOption(this)">Náhodná</button>
            </div>
        `;
        container.appendChild(cardDiv);
    });

    // Funkce pro výběr možnosti
    function selectOption(clickedBtn) {
        // Najdeme všechna tlačítka v rámci aktuální kartičky
        const siblings = clickedBtn.parentElement.querySelectorAll('.option-btn');
        
        // Všem odebereme třídu selected (odškrtneme je) a stavové třídy
        siblings.forEach(btn => {
            btn.classList.remove('selected', 'correct', 'incorrect');
        });

        // Kliknutému tlačítku přidáme třídu selected
        clickedBtn.classList.add('selected');
    }

    // Funkce pro vyhodnocení
    function checkAnswers() {
        const cards = document.querySelectorAll('.card');
        let score = 0;
        let answered = 0;

        cards.forEach(card => {
            const correctType = card.dataset.correctType;
            const selectedBtn = card.querySelector('.option-btn.selected');
            
            // Očistíme případné předchozí barvy u všech tlačítek v kartě
            const allBtns = card.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.classList.remove('correct', 'incorrect'));

            if (selectedBtn) {
                answered++;
                const selectedType = selectedBtn.dataset.value;
                
                if (selectedType === correctType) {
                    selectedBtn.classList.add('correct');
                    score++;
                } else {
                    selectedBtn.classList.add('incorrect');
                    // Ukážeme studentovi, která byla ta správná
                    const correctBtn = card.querySelector(`.option-btn[data-value="${correctType}"]`);
                    correctBtn.classList.add('correct');
                }
            }
        });

        const msgBox = document.getElementById('result-msg');
        if (answered < cards.length) {
            msgBox.style.color = "#ffc107"; // Žlutá
            msgBox.innerText = `Vyplněno ${answered} z ${cards.length}. Zkus doplnit zbytek!`;
        } else {
            msgBox.style.color = score === cards.length ? "#28a745" : "white"; // Zelená nebo bílá
            msgBox.innerText = `Tvůj výsledek: ${score} / ${cards.length}`;
        }
    }
</script>

</body>
</html>
