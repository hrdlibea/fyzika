<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interference Vlnění</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        /* Custom styl pro hezčí posuvníky */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            border-radius: 2px;
        }
        #slider-phi1::-webkit-slider-thumb { background: #3b82f6; }
        #slider-phi1::-webkit-slider-runnable-track { background: #bfdbfe; }
        #slider-delta::-webkit-slider-thumb { background: #ef4444; }
        #slider-delta::-webkit-slider-runnable-track { background: #fecaca; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-5xl w-full overflow-hidden border border-slate-100">
        
        <!-- Hlavička -->
        <div class="bg-slate-800 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">Skládání vlnění (Interference)</h1>
            <p class="text-slate-300 text-sm mt-1">Interaktivní fázorový diagram a časový průběh superpozice vln.</p>
        </div>

        <div class="p-6 md:p-8">
            <!-- Ovládací panel -->
            <div class="flex flex-col md:flex-row gap-6 items-center justify-between bg-slate-50 p-5 rounded-xl mb-8 border border-slate-200">
                
                <div class="flex-1 w-full space-y-4">
                    <!-- Posuvník 1 -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                                <div class="w-3 h-3 rounded-full bg-blue-500"></div>
                                Základní fáze vlny 1 (<span class="font-bold">φ₁</span>)
                            </label>
                            <span id="label-phi1" class="text-sm font-bold text-blue-600">0°</span>
                        </div>
                        <input type="range" id="slider-phi1" min="-180" max="180" value="0" step="5" class="w-full">
                    </div>

                    <!-- Posuvník 2 -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                                Fázový posun vlny 2 (<span class="font-bold">Δφ</span>)
                            </label>
                            <span id="label-delta" class="text-sm font-bold text-red-600">45°</span>
                        </div>
                        <input type="range" id="slider-delta" min="-180" max="180" value="45" step="5" class="w-full">
                    </div>
                </div>

                <!-- Tlačítko Play/Pause -->
                <div class="flex-shrink-0">
                    <button id="btn-play" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-lg font-medium transition-colors shadow-sm w-36">
                        <svg id="icon-pause" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <svg id="icon-play" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span id="text-play">Pozastavit</span>
                    </button>
                </div>
            </div>

            <!-- Vizualizace (Canvas) -->
            <div class="relative bg-white rounded-xl overflow-hidden border border-slate-200">
                <canvas id="canvas-applet" width="900" height="450"></canvas>
            </div>
            
            <!-- Legenda pod plátnem -->
            <div class="flex justify-center gap-8 mt-4 text-sm font-medium">
                <span class="text-blue-600">y₁ = A sin(ωt + φ₁)</span>
                <span class="text-red-600">y₂ = A sin(ωt + φ₁ + Δφ)</span>
                <span class="text-purple-600 font-bold">y = y₁ + y₂ (Součet)</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas-applet');
        const ctx = canvas.getContext('2d');

        // UI Elementy
        const sliderPhi1 = document.getElementById('slider-phi1');
        const sliderDelta = document.getElementById('slider-delta');
        const labelPhi1 = document.getElementById('label-phi1');
        const labelDelta = document.getElementById('label-delta');
        const btnPlay = document.getElementById('btn-play');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const textPlay = document.getElementById('text-play');

        // Fyzikální a vykreslovací konstanty
        let time = 0;
        let isRunning = true;
        const speed = 0.012; // Pomalá animace
        const amplitude = 70; // Amplituda jedné vlny
        const k = 0.03; // Prostorové vlnové číslo pro vykreslení vlny
        
        // Geometrie plátna
        const cxPhasor = 200; // Střed fázorového diagramu (osa X)
        const cy = 225; // Společný střed osy Y
        const cxGraph = 450; // Počátek grafu (osa Y pro graf)
        const graphWidth = 400; // Délka grafu do plusu
        const graphNegWidth = 70; // Délka grafu do mínusu

        // Event Listenery
        btnPlay.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                textPlay.innerText = 'Pozastavit';
            } else {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                textPlay.innerText = 'Spustit';
            }
        });

        function drawAxes() {
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#64748b';
            ctx.font = '12px Inter';

            // --- Kříž pro fázor ---
            ctx.beginPath();
            ctx.moveTo(cxPhasor - 130, cy); ctx.lineTo(cxPhasor + 130, cy);
            ctx.moveTo(cxPhasor, cy - 180); ctx.lineTo(cxPhasor, cy + 180);
            ctx.stroke();
            
            // Kružnice fázoru (poloměr = amplituda)
            ctx.beginPath();
            ctx.arc(cxPhasor, cy, amplitude, 0, Math.PI * 2);
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillText('x', cxPhasor + 115, cy + 15);
            ctx.fillText('y', cxPhasor - 15, cy - 165);

            // --- Kříž pro graf sinusoid ---
            ctx.beginPath();
            // Osa T
            ctx.moveTo(cxGraph - graphNegWidth, cy); ctx.lineTo(cxGraph + graphWidth, cy);
            // Osa Y grafu
            ctx.moveTo(cxGraph, cy - 180); ctx.lineTo(cxGraph, cy + 180);
            ctx.stroke();
            ctx.fillText('t (čas/prostor)', cxGraph + graphWidth - 80, cy + 15);
            ctx.fillText('y', cxGraph - 15, cy - 165);
            ctx.fillText('t=0', cxGraph + 5, cy + 15);
        }

        function drawPhasorVector(vx, vy, color, label, isResultant = false) {
            const lineWidth = isResultant ? 3 : 2;
            
            // Vektor
            ctx.beginPath();
            ctx.moveTo(cxPhasor, cy);
            ctx.lineTo(cxPhasor + vx, cy - vy); // Y je v canvasu obráceně
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.stroke();

            // Hrot
            ctx.beginPath();
            ctx.arc(cxPhasor + vx, cy - vy, lineWidth + 2, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();

            // Popisek
            if (label) {
                const len = Math.sqrt(vx*vx + vy*vy) || 1;
                ctx.fillStyle = color;
                ctx.font = isResultant ? 'bold 14px Inter' : '13px Inter';
                ctx.fillText(label, cxPhasor + vx + (vx/len)*15 - 5, cy - vy - (vy/len)*15);
            }
        }

        function drawProjectionLine(startY, color) {
            ctx.beginPath();
            ctx.moveTo(cxPhasor, startY);
            ctx.lineTo(cxGraph, startY);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Kolečko na ose Y v grafu
            ctx.beginPath();
            ctx.arc(cxGraph, startY, 4, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Aktualizace hodnot z UI
            const phi1Deg = parseInt(sliderPhi1.value);
            const deltaDeg = parseInt(sliderDelta.value);
            
            labelPhi1.innerText = `${phi1Deg}°`;
            labelDelta.innerText = `${deltaDeg >= 0 ? '+' : ''}${deltaDeg}°`;

            const phi1Rad = phi1Deg * (Math.PI / 180);
            const phi2Rad = (phi1Deg + deltaDeg) * (Math.PI / 180);

            drawAxes();

            // Úhly rotující v čase (omega = 1 pro vizualizaci rotace)
            const angle1 = time + phi1Rad;
            const angle2 = time + phi2Rad;

            // Fázor 1 (Modrý)
            const v1x = amplitude * Math.cos(angle1);
            const v1y = amplitude * Math.sin(angle1);
            
            // Fázor 2 (Červený)
            const v2x = amplitude * Math.cos(angle2);
            const v2y = amplitude * Math.sin(angle2);

            // Výsledný fázor (Součet - Fialový)
            const vrx = v1x + v2x;
            const vry = v1y + v2y;

            // Konstrukce rovnoběžníku pro sčítání fázorů
            ctx.beginPath();
            ctx.moveTo(cxPhasor + v1x, cy - v1y);
            ctx.lineTo(cxPhasor + vrx, cy - vry);
            ctx.moveTo(cxPhasor + v2x, cy - v2y);
            ctx.lineTo(cxPhasor + vrx, cy - vry);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Vykreslení fázorů
            drawPhasorVector(v1x, v1y, '#3b82f6', 'y₁');
            drawPhasorVector(v2x, v2y, '#ef4444', 'y₂');
            drawPhasorVector(vrx, vry, '#9333ea', 'y', true);

            // --- Projekční čáry v t=0 ---
            // Spojují hrot fázoru a osu Y v grafu
            drawProjectionLine(cy - v1y, 'rgba(59, 130, 246, 0.6)');
            drawProjectionLine(cy - v2y, 'rgba(239, 68, 68, 0.6)');
            drawProjectionLine(cy - vry, 'rgba(147, 51, 234, 0.6)');

            // --- Vykreslení grafů vlnění ---
            ctx.beginPath(); const path1 = new Path2D();
            ctx.beginPath(); const path2 = new Path2D();
            ctx.beginPath(); const pathR = new Path2D();

            for (let x = -graphNegWidth; x <= graphWidth; x++) {
                // Posun fáze z leva do prava odpovídá vlnové rovnici
                const w1y = amplitude * Math.sin(time - k*x + phi1Rad);
                const w2y = amplitude * Math.sin(time - k*x + phi2Rad);
                const wry = w1y + w2y;

                if (x === -graphNegWidth) {
                    path1.moveTo(cxGraph + x, cy - w1y);
                    path2.moveTo(cxGraph + x, cy - w2y);
                    pathR.moveTo(cxGraph + x, cy - wry);
                } else {
                    path1.lineTo(cxGraph + x, cy - w1y);
                    path2.lineTo(cxGraph + x, cy - w2y);
                    pathR.lineTo(cxGraph + x, cy - wry);
                }
            }

            ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke(path1);
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.stroke(path2);
            ctx.strokeStyle = '#9333ea'; ctx.lineWidth = 3; ctx.stroke(pathR);
        }

        function animateLoop() {
            if (isRunning) {
                time += speed;
            }
            render();
            requestAnimationFrame(animateLoop);
        }

        window.onload = () => {
            render(); // První statické vykreslení
            animateLoop(); // Start smyčky
        };
    </script>
</body>
</html>
